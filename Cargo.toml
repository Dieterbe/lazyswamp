[package]
name = "lazyswamp"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "A terminal UI for browsing and running Swamp models"
readme = "README.md"

[dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.29"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "io-util", "sync", "time"] }

[profile.release]
lto = "thin"
strip = true
